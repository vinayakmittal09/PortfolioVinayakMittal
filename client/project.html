<style>
  .pj-hero{position:relative;height:82vh;min-height:480px;overflow:hidden;}
  .pj-hero img,.pj-hero video{width:100%;height:100%;object-fit:cover;}
  .pj-hero .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,11,.1),rgba(12,12,11,.85));}
  .pj-hero-content{position:absolute;bottom:56px;left:0;right:0;padding:0 var(--gutter);}
  .pj-meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:56px 0;}
  .pj-meta-grid div{border-top:1px solid var(--border);padding-top:14px;}
  .pj-meta-grid .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px;}
  .pj-meta-grid .v{font-family:var(--font-display);font-size:22px;}
  .pj-desc{font-size:clamp(20px,2.6vw,30px);line-height:1.5;max-width:60ch;margin-bottom:60px;}
  .pj-gallery{display:flex;flex-direction:column;gap:var(--gutter);}
  .pj-gallery figure{margin:0;overflow:hidden;cursor:pointer;}
  .pj-gallery img,.pj-gallery video{width:100%;transition:transform .8s var(--ease-soft);}
  .pj-gallery figure:hover img{transform:scale(1.04);}
  .pj-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter);}
  .pj-next{display:flex;justify-content:space-between;align-items:center;padding:70px 0;border-top:1px solid var(--border);margin-top:80px;}
  .pj-next .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
  .pj-next .title{font-family:var(--font-display);font-size:clamp(30px,5vw,54px);}
  @media (max-width:760px){.pj-meta-grid{grid-template-columns:1fr 1fr;}.pj-pair{grid-template-columns:1fr;}}
</style>
</head>
